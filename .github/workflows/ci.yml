name: CRM Web — Build, Push & Deploy

# Runs on every push to main, or manually from the Actions tab ("Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to the server after pushing the image"
        type: boolean
        default: true

# Never run two deploys of this repo at the same time
concurrency:
  group: crm-web-deploy
  cancel-in-progress: false

env:
  IMAGE: ${{ vars.DOCKERHUB_NAMESPACE || 'jeeejagani' }}/crm-web
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/root/stackdot-crm' }}

jobs:
  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          pull: true
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || '/api' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy)
    runs-on: ubuntu-latest
    environment: production
    steps:
      # docker-compose.yml on the server is managed by the crm-api repo's workflow
      - name: Pull & restart web
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,DEPLOY_PATH
          script: |
            set -e
            cd "$DEPLOY_PATH"
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            docker compose pull crm-web
            docker logout
            docker compose up -d --no-deps crm-web

            echo "Waiting for crm-web to become healthy..."
            for i in $(seq 1 20); do
              status=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q crm-web)")
              [ "$status" = "healthy" ] && echo "crm-web is healthy" && break
              [ "$i" = "20" ] && { echo "crm-web did not become healthy"; docker compose logs --tail=100 crm-web; exit 1; }
              sleep 3
            done

            docker image prune -f
