name: stage-ci-pipeline

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Login Dockerhub
        env:
          STACKDOT_DOCKER_USERNAME: ${{secrets.STACKDOT_DOCKER_USERNAME}}
          STACKDOT_DOCKER_PASSWORD: ${{secrets.STACKDOT_DOCKER_PASSWORD}}
        run: docker login -u $STACKDOT_DOCKER_USERNAME -p $STACKDOT_DOCKER_PASSWORD

      - name: Build the Docker image
        run: docker build -t jeeejagani/crm-web .
      - name: Push to Dockerhub
        run: docker push jeeejagani/crm-web
      - name: Change tag and push it to dockerhub   
        run: | 
          current_date=$(date "+%d.%m.%y.%H.%M.%S.%3N")
          docker tag jeeejagani/crm-web jeeejagani/crm-web:$current_date
          docker push jeeejagani/crm-web:$current_date

      - name: Deploy to Ubuntu Server
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          sshpass -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no $SERVER_USERNAME@$SERVER_IP << 'EOF'
            cd ~/stackdot-crm
            docker compose pull
            docker compose up -d
            docker system prune -f
          EOF